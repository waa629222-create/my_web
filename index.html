
<!DOCTYPE html>
<html lang="zh-CN">

  <style>
 /* 爱心飞出动画 */
#likeButton {
  position: relative;
  overflow: visible;
}

.floating-heart {
  position: fixed;
  z-index: 9999;
  pointer-events: none;
  color: #ff4d6d;
  font-size: 22px;
  line-height: 1;
  animation: heartFly 0.9s ease-out forwards;
}

@keyframes heartFly {
  0% {
    opacity: 1;
    transform: translate(-50%, 0) scale(0.5) rotate(0deg);
  }
  35% {
    opacity: 1;
    transform: translate(calc(-50% + var(--drift)), -45px)
      scale(1.2) rotate(var(--rotate));
  }
  100% {
    opacity: 0;
    transform: translate(calc(-50% + var(--drift)), -120px)
      scale(0.8) rotate(var(--rotate));
  }
}
    #likeButton {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border: none;
  border-radius: 24px;
  background: #ff768b;
  color:  white;
  font-size: 16px;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.2s ease;
}

#likeButton .like-icon {
  display: inline-block;
  color: #fff;
  font-size: 20px;
}

  #likeButton:hover {
    background: #ff8f9f;
  }

  #likeButton:active {
    transform: scale(0.9);
  }

  #likeButton .like-icon {
    display: inline-block;
    font-size: 20px;
    transition: transform 0.25s ease;
  }

  #likeButton.liked .like-icon {
    animation: heartPop 0.4s ease;
  }

  #likeButton:disabled {
    opacity: 0.7;
    cursor: wait;
  }

  @keyframes heartPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.6) rotate(-12deg); }
    70% { transform: scale(0.85) rotate(8deg); }
    100% { transform: scale(1); }
  }

  #likeCount {
    display: inline-block;
    transition: color 0.2s ease;
  }

  #likeCount.count-pop {
    animation: countPop 0.35s ease;
  }

  @keyframes countPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); color: #ff8d9e; }
    100% { transform: scale(1); }
  }
</style>
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人博客</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>你好，欢迎来到我的博客！</h1>

  <p>这是我亲手制作的第一个网页。</p>

  <h2>关于我</h2>
  <p>我正在学习网站开发，希望在这里记录自己的成长。</p>

  <h2>我的兴趣</h2>
  <button id="helloButton">点击这里</button>
  <p id="message"></p>
  <p>学习新知识、记录生活、探索有趣的项目。</p>

 <button id="likeButton" type="button">
  <span class="like-icon">♥</span>
  <span id="likeCount">...</span>
</button>

  <script src="script.js"></script>

  <script>
    // 替换成你自己的 Worker 地址，不要添加 /api/likes
    const API_BASE = "https://site-likes-api.waa629222.workers.dev";
    const API_URL = API_BASE + "/api/likes";

    const countElement = document.getElementById("likeCount");
    const likeButton = document.getElementById("likeButton");

    // 获取全站点赞数
    async function loadLikes() {
      try {
        const response = await fetch(API_URL, {
          cache: "no-store"
        });

        if (!response.ok) throw new Error("Request failed");

        const data = await response.json();
        countElement.textContent = data.total;
      } catch (error) {
        console.error(error);
      }
    }

    // 每点击一次，点赞总数加 1
    // 生成从按钮飞出的爱心
function createFlyingHearts() {
  const rect = likeButton.getBoundingClientRect();

  for (let i = 0; i < 6; i++) {
    const heart = document.createElement("span");
    heart.className = "floating-heart";
    heart.textContent = "♥";

    // 让爱心从按钮附近随机位置飞出
    heart.style.left =
      (rect.left + rect.width / 2 + (Math.random() - 0.5) * 35) + "px";

    heart.style.top =
      (rect.top + rect.height / 2) + "px";

    // 设置不同的飞行方向和旋转角度
    heart.style.setProperty(
      "--drift",
      ((Math.random() - 0.5) * 100) + "px"
    );

    heart.style.setProperty(
      "--rotate",
      ((Math.random() - 0.5) * 70) + "deg"
    );

    document.body.appendChild(heart);

    // 动画结束后删除元素，避免页面积累太多元素
    heart.addEventListener("animationend", () => {
      heart.remove();
    });
  }
}
    likeButton.addEventListener("click", async () => {
  likeButton.disabled = true;
      createFlyingHearts();

  // 播放爱心动画
  likeButton.classList.remove("liked");
  void likeButton.offsetWidth;
  likeButton.classList.add("liked");

  try {
    const response = await fetch(API_URL, {
      method: "POST"
    });

    if (!response.ok) {
      throw new Error("Request failed");
    }

    const data = await response.json();

    // 更新点赞数
    countElement.textContent = data.total;

    // 播放数字跳动动画
    countElement.classList.remove("count-pop");
    void countElement.offsetWidth;
    countElement.classList.add("count-pop");

  } catch (error) {
    console.error(error);
  } finally {
    likeButton.disabled = false;
  }
});

    // 页面打开时读取点赞总数
    loadLikes();
  </script>
</body>
</html>
